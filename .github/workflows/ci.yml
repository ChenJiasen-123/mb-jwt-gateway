name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check and test MoonBit
        run: |
          moon check --deny-warn
          moon test
          moon test --target js
          moon test --target native
          moon info
          moon fmt --check gateway/src crypto/mb-jwt/src crypto/mb-p256/src crypto/mb-hmac/src crypto/mb-hash/src/sha2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Worker checks (no deployment)
        working-directory: examples/cloudflare-worker
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check
          npm run build
